# A RoleBinding can point at a ClusterRole: the built-in "view" role,
# but granted only inside namespace demo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: viewer
  namespace: demo
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: viewer-view
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: viewer
    namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole                 # reusable definition ...
  name: view                        # ... applied only in this RoleBinding's namespace
