# WHO gets the Role: the config-reader ServiceAccount, in namespace demo only.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-reader-configmap-reader
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: config-reader
    namespace: demo
roleRef:                            # cannot be changed later: delete and recreate instead
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: configmap-reader
