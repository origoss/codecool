# Deliberately broken, for the "When it does not sync" section: shop/prod/db is
# outside the codecool/ prefix that ESO's IAM role may read, so AWS denies it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shop-db
  namespace: demo
spec:
  refreshInterval: 1m
  secretStoreRef: {kind: SecretStore, name: aws-secrets-manager}
  target: {name: shop-db}
  data:
    - secretKey: password
      remoteRef: {key: shop/prod/db, property: password}
