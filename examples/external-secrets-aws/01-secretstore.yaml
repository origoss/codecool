# How to reach AWS Secrets Manager. No auth block: the ESO controller uses the
# credentials EKS Pod Identity gives its ServiceAccount (see infra/eso.tf).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: demo
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
