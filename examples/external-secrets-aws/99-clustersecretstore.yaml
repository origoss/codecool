# For comparison only, not applied in the demo: the cluster-wide variant.
# Any namespace's ExternalSecret can reference it with kind: ClusterSecretStore,
# so every team shares the controller's IAM permissions. Restrict who may use it.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  conditions:
    - namespaces: ["demo"]         # only ExternalSecrets in these namespaces may use this store
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
