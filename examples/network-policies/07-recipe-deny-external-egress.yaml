# Recipe 14 from github.com/ahmetb/kubernetes-network-policy-recipes (Apache-2.0), AS PUBLISHED, namespace demo.
# Trap: only DNS is allowed, so app=foo loses in-cluster traffic too, not just external. See 08 for the fix.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: foo-deny-external-egress
  namespace: demo
spec:
  podSelector:
    matchLabels:
      app: foo
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
      - port: 53
        protocol: UDP
      - port: 53
        protocol: TCP
