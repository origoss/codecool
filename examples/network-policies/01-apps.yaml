# Two apps in namespace demo. The labels app=frontend / app=backend are what every policy selects on.
# Deployments, not bare Pods: on EKS, policy enforcement is reliable only for Pods with ownerReferences.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine   # listens on 8080, runs as non-root
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: demo
spec:
  selector:
    app: backend
  ports:
    - port: 8080          # same as targetPort: the EKS VPC CNI policy agent requires it
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: client      # stands in for a real frontend: it only needs curl
          image: curlimages/curl:8.11.1
          command: ["sleep", "infinity"]
